name: apply-reviewed-safety-retry
on:
  pull_request:
    paths: ['.github/workflows/apply-reviewed-safety-retry.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.event.pull_request.number == 1 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'migration/source-and-requirements'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact reviewed patch bytes
        shell: python
        run: |
          import base64, hashlib, pathlib, zlib
          source = pathlib.Path('.github/workflows/apply-reviewed-safety.yml').read_text()
          encoded = source.split("encoded = '''")[1].split("'''")[0]
          corrections = [
              ('LKUyE0tyUZzEJpNpJjqj2N9+J', 'LKUyE0tyUZzEIpNpJjqj2N9+J'),
              ('HQSI9lP1mJu6KbpzDlriAbo/a', 'HQSI9lP1mJu6pbpzDlriAbo/a'),
              ('JZggJzdME5lE0UlE28NQGJhWiNSj', 'JZggJzdME5lE28NQGJhWiNSj'),
              ('zpIAiN+41CPtS6ImP94WiOcKv', 'zpIAiN+41CPtT6ImP94WiOcKv'),
          ]
          for old, new in corrections:
              assert encoded.count(old) == 1
              encoded = encoded.replace(old, new)
          patch = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '6d74d92ad8a1655c01f3f770efa98c8ea297c06144a2675e8958a82d6467abd4'
          pathlib.Path('/tmp/reviewed-safety.patch').write_bytes(patch)
      - name: Apply and commit source changes only
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git apply --reverse --check /tmp/reviewed-safety.patch 2>/dev/null; then exit 0; fi
          git apply --check --whitespace=error /tmp/reviewed-safety.patch
          git apply --index --whitespace=error /tmp/reviewed-safety.patch
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve move sources, serialize SSH output and terminate rsync at remote EOF'
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
