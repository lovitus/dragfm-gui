name: validate-and-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      package_macos_candidate:
        description: 'Package and verify the macOS arm64 candidate without publishing'
        type: boolean
        default: true
  workflow_call:
    inputs:
      package_macos_candidate:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive the exact tracked source and record provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          git archive --format=tar.gz --prefix=dragfm-gui/ HEAD > "$RUNNER_TEMP/source/dragfm-gui-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/source/COMMIT.txt"
          cd "$RUNNER_TEMP/source"
          sha256sum dragfm-gui-source.tar.gz > SHA256SUMS
      - name: Bind the completed source archive to this event
        run: python3 build/ci/record-evidence.py "$RUNNER_TEMP/source" --stage source --file COMMIT.txt --file SHA256SUMS --file dragfm-gui-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dragfm-gui-source
          path: ${{ runner.temp }}/source/
          if-no-files-found: error
          retention-days: 7

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare test reports
        run: mkdir -p test-results
      - name: Install native test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1-mesa-dev xorg-dev xvfb libgtk-3-dev libwebkit2gtk-4.1-dev ncat zsh openssh-sftp-server
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Frontend dependency advisory report
        shell: bash
        run: |
          npm --prefix frontend audit --json > test-results/npm-audit.json || status=$?
          test "${status:-0}" -le 1
      - name: Test frontend
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend test -- --run 2>&1 | tee test-results/frontend.log
      - name: Bind the unchanged pinned FlySSH default contracts to the actual vendor
        # 7ed recorded both designated no-p permission contrasts. Retain the
        # exact upstream/current positive contracts, without repeating old red.
        run: python3 build/ci/flyssh-compatibility.py
      - name: Build production frontend
        run: npm --prefix frontend run build
      - name: Test all Go packages using the supported X11 build
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a go test -mod=vendor -tags=x11,webkit2_41 -count=1 -timeout=5m -json ./... | tee test-results/go-unit.jsonl
      - name: Race-test application packages
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a go test -mod=vendor -tags=x11,webkit2_41 -race -count=1 -timeout=5m -json ./internal/... | tee test-results/go-race.jsonl
      - name: Repeat sudo credential and process-exit regressions under the race detector
        shell: bash
        run: |
          set -euo pipefail
          go test -mod=vendor -race -count=20 -timeout=3m -json ./internal/endpoint -run '^TestSudo(AtomicWriterKeepsCredentialAndDataStreamsSeparate|RunClosedUnusedPasswordPipePreservesExitStatus|RunCancelledContextDoesNotBecomeSuccess)$' | tee test-results/sudo-race-repeat.jsonl
      - name: Vet all Go packages
        run: go vet -mod=vendor -tags=x11,webkit2_41 ./...
      - name: Record successful completion of the whole regression producer
        run: >-
          python3 build/ci/record-evidence.py test-results
          --stage frontend --stage frontend-production --stage flyssh-compatibility --stage go-unit --stage go-race --stage sudo-race --stage vet
          --file frontend.log --file FLYSSH_COMPATIBILITY.json --file go-unit.jsonl --file go-race.jsonl --file sudo-race-repeat.jsonl --file npm-audit.json
      - name: Retain test evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dragfm-gui-test-results
          path: test-results/
          if-no-files-found: error
          retention-days: 14

  ssh:
    uses: ./.github/workflows/ssh-integration.yml

  build-macos-arm64:
    needs: test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: ./build/build-wails-macos.sh dist
      - name: Install hosted-only native input dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/dragfm-native-python"
          "$RUNNER_TEMP/dragfm-native-python/bin/python" -m pip install PyAutoGUI==0.9.54 pyobjc-framework-ApplicationServices==12.2.2
      - name: Native macOS window, real SSH, queue and process-restart acceptance
        run: '"$RUNNER_TEMP/dragfm-native-python/bin/python" build/ci/native-smoke.py dist/dragfm-gui-wails-darwin-arm64'
      - name: Bind the full native evidence and tested executable to this event
        run: |
          git rev-parse HEAD > test-results/native-macos-arm64/COMMIT.txt
          git rev-parse HEAD > dist/COMMIT.txt
          python3 build/ci/record-evidence.py test-results/native-macos-arm64 --stage macos-native \
            --file COMMIT.txt --file BINARY_SHA256.txt --file NORMAL_STARTUP_VAULT.json \
            --file exercise.json --file restore.json --file changed-key.json --file FILESYSTEM_VERIFIED.json
          python3 build/ci/record-evidence.py dist --stage macos-arm64-build --stage macos-native \
            --file COMMIT.txt --file dragfm-gui-wails-darwin-arm64 --file SHA256SUMS.wails
      - name: Preserve native window evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dragfm-gui-native-macos-evidence
          path: test-results/native-macos-arm64/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: dragfm-gui-macos-arm64
          path: |
            dist/dragfm-gui-wails-darwin-arm64
            dist/SHA256SUMS.wails
            dist/COMMIT.txt
            dist/ARTIFACT_RECEIPT.json
          if-no-files-found: error

  package-macos-candidate:
    if: >-
      ${{ !cancelled() && needs.source.result == 'success' && needs.test.result == 'success'
          && needs.build-macos-arm64.result == 'success' && needs.ssh.result == 'success'
          && (inputs.package_macos_candidate == true || github.event_name == 'pull_request'
              || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    needs: [source, test, build-macos-arm64, ssh]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked license inputs only, without rebuilding the application
        run: npm --prefix frontend ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: dragfm-gui-*
          path: release-input
      - name: Verify the real single-platform flow and refusal controls without repeating completed contrasts
        run: python3 build/ci/package-candidate-check.py
      - name: Package only the exact full-native Mac bytes and corresponding source
        run: python3 build/ci/package-release.py --platform darwin-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: dragfm-gui-macos-arm64-candidate-bundle
          path: release-bundle/
          if-no-files-found: error
      - name: Retain bounded packaging verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dragfm-gui-macos-arm64-packaging-checks
          path: test-results/package-candidate/
          if-no-files-found: warn

  verify-packaged-macos-candidate:
    needs: package-macos-candidate
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TARGET_OS: darwin
      TARGET_ARCH: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: dragfm-gui-macos-arm64-candidate-bundle
          path: release-bundle
      - name: Verify complete manifest, source and the actual extracted product
        id: extracted
        run: |
          python3 build/ci/extract-release.py
          test -x unpacked/dragfm-gui/dragfm-gui
          file unpacked/dragfm-gui/dragfm-gui | grep 'Mach-O 64-bit executable arm64'
          codesign --verify --verbose=2 unpacked/dragfm-gui/dragfm-gui
      - name: Install only the hosted native acceptance dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/dragfm-packaged-python"
          "$RUNNER_TEMP/dragfm-packaged-python/bin/python" -m pip install PyAutoGUI==0.9.54 pyobjc-framework-ApplicationServices==12.2.2
      - name: Run the unchanged native acceptance on the genuinely extracted binary
        run: '"$RUNNER_TEMP/dragfm-packaged-python/bin/python" build/ci/native-smoke.py unpacked/dragfm-gui/dragfm-gui'
      - name: Verify unchanged bytes and record separate extracted-package acceptance
        env:
          VERIFIED_MANIFEST_SHA256: ${{ steps.extracted.outputs.manifest_sha256 }}
        run: |
          codesign --verify --verbose=2 unpacked/dragfm-gui/dragfm-gui
          python3 build/ci/record-packaged-acceptance.py
      - name: Retain only the bounded acceptance receipt, not raw native logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dragfm-gui-macos-arm64-packaged-acceptance
          path: test-results/packaged-acceptance/
          if-no-files-found: warn
