name: validate-and-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive the exact tracked source and record provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          git archive --format=tar.gz --prefix=dragfm-gui/ HEAD > "$RUNNER_TEMP/source/dragfm-gui-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/source/COMMIT.txt"
          cd "$RUNNER_TEMP/source"
          sha256sum dragfm-gui-source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dragfm-gui-source
          path: ${{ runner.temp }}/source/
          if-no-files-found: error
          retention-days: 7

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare test reports
        run: mkdir -p test-results
      - name: Install native test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1-mesa-dev xorg-dev xvfb libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Frontend dependency advisory report
        shell: bash
        run: |
          npm --prefix frontend audit --json > test-results/npm-audit.json || status=$?
          test "${status:-0}" -le 1
      - name: Test frontend
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend test -- --run 2>&1 | tee test-results/frontend.log
      - name: Build production frontend
        run: npm --prefix frontend run build
      - name: Test all Go packages using the supported X11 build
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a go test -mod=vendor -tags=x11,webkit2_41 -count=1 -timeout=5m -json ./... | tee test-results/go-unit.jsonl
      - name: Race-test application packages
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a go test -mod=vendor -tags=x11,webkit2_41 -race -count=1 -timeout=5m -json ./internal/... | tee test-results/go-race.jsonl
      - name: Vet all Go packages
        run: go vet -mod=vendor -tags=x11,webkit2_41 ./...
      - name: Retain test evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dragfm-gui-test-results
          path: test-results/
          if-no-files-found: error
          retention-days: 14

  build-macos-arm64:
    needs: test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: ./build/build-wails-macos.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: dragfm-gui-macos-arm64
          path: |
            dist/dragfm-gui-wails-darwin-arm64
            dist/SHA256SUMS.wails
          if-no-files-found: error
