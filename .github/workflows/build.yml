name: validate-and-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive the exact tracked source and record provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          git archive --format=tar.gz --prefix=dragfm-gui/ HEAD > "$RUNNER_TEMP/source/dragfm-gui-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/source/COMMIT.txt"
          cd "$RUNNER_TEMP/source"
          sha256sum dragfm-gui-source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dragfm-gui-source
          path: ${{ runner.temp }}/source/
          if-no-files-found: error
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux GUI headers
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Test Go packages
        run: |
          npm --prefix frontend run build
          go test -mod=vendor ./...
      - name: Vet Go packages
        run: go vet -mod=vendor ./...
      - name: Test frontend
        run: npm --prefix frontend test -- --run
      - name: Build frontend
        run: npm --prefix frontend run build

  build-macos-arm64:
    needs: test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: ./build/build-wails-macos.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: dragfm-gui-macos-arm64
          path: |
            dist/dragfm-gui-wails-darwin-arm64
            dist/SHA256SUMS.wails
          if-no-files-found: error
