name: native-platforms
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: platforms-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, goos: linux, goarch: amd64 }
          - { runner: ubuntu-24.04-arm, goos: linux, goarch: arm64 }
          - { runner: windows-2025, goos: windows, goarch: amd64 }
          - { runner: windows-11-arm, goos: windows, goarch: arm64 }
          - { runner: macos-15-intel, goos: darwin, goarch: amd64 }
          - { runner: macos-15, goos: darwin, goarch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TARGET_OS: ${{ matrix.goos }}
      TARGET_ARCH: ${{ matrix.goarch }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux native WebKit dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev xvfb dbus-x11
      - name: Build the current native Wails application
        run: |
          set -euo pipefail
          mkdir -p platform-output/evidence
          git rev-parse HEAD > platform-output/COMMIT.txt
          test "$(go env GOHOSTOS)" = "$TARGET_OS"
          test "$(go env GOHOSTARCH)" = "$TARGET_ARCH"
          npm --prefix frontend ci
          if [ "$TARGET_OS" = darwin ]; then
            DRAGFM_MAC_ARCH="$TARGET_ARCH" ./build/build-wails-macos.sh platform-output
            mv "platform-output/dragfm-gui-wails-darwin-$TARGET_ARCH" platform-output/dragfm-gui
          else
            ./build/build-linux-agents.sh
            npm --prefix frontend run build
            if [ "$TARGET_OS" = windows ]; then
              CGO_ENABLED=0 go build -mod=vendor -trimpath -buildvcs=false -tags production -ldflags='-s -w -H=windowsgui' -o platform-output/dragfm-gui.exe ./cmd/dragfm-wails
            else
              go build -mod=vendor -trimpath -buildvcs=false -tags production,webkit2_41 -ldflags='-s -w' -o platform-output/dragfm-gui ./cmd/dragfm-wails
            fi
          fi
      - name: Windows file-identity and child-process cancellation regressions
        if: runner.os == 'Windows'
        run: go test -mod=vendor -count=1 -timeout=2m -run 'TestWindowsFileIdentity|TestLocalCommandCancellation' ./internal/endpoint
      - name: Native window, local filesystem, PTY and process-restart acceptance
        run: |
          set -euo pipefail
          if [ "$TARGET_OS" = linux ]; then
            GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' python build/ci/portable-smoke.py platform-output/dragfm-gui
          elif [ "$TARGET_OS" = windows ]; then
            python build/ci/portable-smoke.py platform-output/dragfm-gui.exe
          else
            python build/ci/portable-smoke.py platform-output/dragfm-gui
          fi
      - name: Preserve native evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dragfm-gui-platform-failure-${{ matrix.goos }}-${{ matrix.goarch }}
          path: platform-output/evidence/
          if-no-files-found: warn
      - name: Retain only successfully exercised platform binaries
        uses: actions/upload-artifact@v4
        with:
          name: dragfm-gui-platform-${{ matrix.goos }}-${{ matrix.goarch }}
          path: platform-output/
          if-no-files-found: error
          retention-days: 14
