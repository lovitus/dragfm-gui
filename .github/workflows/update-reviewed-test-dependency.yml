name: apply-reviewed-release-fixes
on:
  pull_request:
    paths: ['.github/workflows/update-reviewed-test-dependency.yml']
permissions:
  contents: read
jobs:
  update:
    if: github.event.pull_request.number == 1 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'migration/source-and-requirements'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Upgrade only the reviewed Vitest patch release
        run: npm --prefix frontend install --package-lock-only --ignore-scripts --save-dev --save-exact vitest@4.1.11
      - name: Apply the reviewed navigation race fix and native diagnostics
        shell: python
        run: |
          from pathlib import Path
          p=Path('frontend/src/components/Workspace.tsx')
          s=p.read_text()
          before="  const revisions = useRef<Record<PaneID, number>>({ left: 0, right: 0 })"
          assert s.count(before)==1
          s=s.replace(before,before+"\n  const listingInFlight = useRef<Record<PaneID, boolean>>({ left: false, right: false })")
          before="  const load = useCallback(async (pane: PaneID, path?: string, endpoint?: string) => {\n    const current"
          assert s.count(before)==1
          s=s.replace(before,"  const load = useCallback(async (pane: PaneID, path?: string, endpoint?: string) => {\n    // A completion refresh must not replace a newer user navigation with\n    // the old, still-rendered directory while its request is in flight.\n    if (path === undefined && endpoint === undefined && listingInFlight.current[pane]) return\n    listingInFlight.current[pane] = true\n    const current")
          before="      setModels((old) => ({ ...old, [pane]: { ...old[pane], loading: false, error: String(reason) } }))\n    }"
          assert s.count(before)==2
          s=s.replace(before,before[:-5]+"    } finally {\n      if (revision === revisions.current[pane]) listingInFlight.current[pane] = false\n    }")
          s=s.replace("  const changeEndpoint = async (pane: PaneID, endpoint: string) => {\n", "  const changeEndpoint = async (pane: PaneID, endpoint: string) => {\n    listingInFlight.current[pane] = true\n")
          p.write_text(s)
          p=Path('build/ci/native-smoke.js');s=p.read_text()
          s=s.replace("      key(pane('left').querySelector('.file-viewport'), 'Backspace', 8);", "      await wait('left pane focused', () => pane('left').classList.contains('active'));\n      key(pane('left').querySelector('.file-viewport'), 'Backspace', 8);")
          s=s.replace("      hashRow.click();\n      key(hashRow, 'h', 72);", "      hashRow.click();\n      await wait('hash row selected', () => hashRow.classList.contains('selected'));\n      key(hashRow, 'h', 72);")
          s=s.replace("      removeRow.click(); key(removeRow, 'd', 68);", "      removeRow.click();\n      await wait('delete row selected', () => removeRow.classList.contains('selected'));\n      key(removeRow, 'd', 68);")
          s=s.replace("stage, checks, error: message }", "stage, checks, error: message, leftPath: pathInput('left')?.value, rightPath: pathInput('right')?.value, leftCWD: cwd.left?.path, rightCWD: cwd.right?.path, active: document.querySelector('.file-pane.active')?.dataset.pane, modalCount: document.querySelectorAll('.modal-backdrop').length }")
          p.write_text(s)
      - name: Commit only the reviewed dependency and navigation files
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git diff --check
          git add frontend/package.json frontend/package-lock.json frontend/src/components/Workspace.tsx build/ci/native-smoke.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve navigation during refresh and patch Vitest advisory'
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
