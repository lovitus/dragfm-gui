name: validate-reviewed-backend
on:
  pull_request:
    paths: ['.github/workflows/recover-backend.yml']
permissions:
  contents: read
jobs:
  validate-and-regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'migration/source-and-requirements'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Align the merge regression with atomic per-file commits
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          mkdir -p test-results
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/transfer/transfer_test.go')
          text = p.read_text()
          old = 'if err != nil || result.Verification != "same-machine-cp" {'
          assert text.count(old) == 1
          text = text.replace(old, 'if err != nil || result.Verification != "atomic-write" {')
          text = text.replace('func TestNativeDirectoryCopyMergesContentsWithoutExtraSourceLayer', 'func TestAtomicDirectoryMergeKeepsContentsWithoutExtraSourceLayer')
          p.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/transfer/transfer_test.go
          git commit -m 'test: verify atomic directory merge without an extra source layer'
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
      - name: Race-test recovered application code
        shell: bash
        run: |
          set -euo pipefail
          go test -mod=vendor -race -count=1 -timeout=4m -json ./internal/webgui ./internal/jobs ./internal/transfer ./internal/endpoint ./internal/configtext ./internal/vault 2>&1 | tee test-results/recovery-race.jsonl
      - name: Rebuild embedded Linux agents from this source
        run: ./build/build-linux-agents.sh
      - name: Commit regenerated agent payloads
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git add internal/assets/payload/dragfm-agent-linux-*.gz
          if ! git diff --cached --quiet; then
            git commit -m 'build: regenerate embedded agents after transfer safety fixes'
            git push origin "HEAD:refs/heads/$HEAD_BRANCH"
          fi
      - name: Preserve source and test evidence
        if: always()
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/COMMIT.txt
          git archive --format=tar.gz --prefix=dragfm-gui/ HEAD > test-results/dragfm-gui-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-recovery-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: error
