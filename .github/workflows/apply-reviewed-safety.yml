name: apply-reviewed-safety
on:
  pull_request:
    paths: ['.github/workflows/apply-reviewed-safety.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.event.pull_request.number == 1 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'migration/source-and-requirements'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Decode and verify reviewed patch transport
        shell: python
        run: |
          import base64, hashlib, pathlib, zlib
          # This temporary transport is removed after the resulting ordinary
          # source commit. The source diff, not this encoding, is the review record.
          encoded = ''''''
          patch = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '6d74d92ad8a1655c01f3f770efa98c8ea297c06144a2675e8958a82d6467abd4'
          pathlib.Path('/tmp/reviewed-safety.patch').write_bytes(patch)
      - name: Apply and commit the reviewed source diff
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git apply --reverse --check /tmp/reviewed-safety.patch 2>/dev/null; then exit 0; fi
          git apply --check --whitespace=error /tmp/reviewed-safety.patch
          git apply --index --whitespace=error /tmp/reviewed-safety.patch
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve move sources, serialize SSH output and terminate rsync at remote EOF'
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
