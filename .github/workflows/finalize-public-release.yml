name: wire-reviewed-public-release
on:
  pull_request:
    paths: ['.github/workflows/finalize-public-release.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.event.pull_request.number == 1 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'migration/source-and-requirements'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Apply bounded probes, native signing and fixture diagnostics
        run: |
          python3 build/ci/finalize-public-release.py
          # GITHUB_TOKEN can commit source but cannot update other workflows.
          # The reviewed platform-workflow change is committed through the
          # authorized GitHub connector, not by widening this runner's token.
          git restore .github/workflows/platforms.yml
          git ls-files -z '*.go' ':!:vendor/*' ':!:third_party/*' | xargs -0 gofmt -w
          git diff --check
          go test -mod=vendor -count=1 -timeout=5m ./internal/endpoint ./internal/transfer ./internal/webgui
          python3 -m py_compile build/ci/package-release.py build/ci/extract-release.py build/ci/native-smoke.py
      - name: Remove completed helper and commit validated edits
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git rm .github/workflows/finalize-public-release.yml build/ci/finalize-public-release.py
          git add -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: bound remote identity probes and sign tested macOS distribution bytes'
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
