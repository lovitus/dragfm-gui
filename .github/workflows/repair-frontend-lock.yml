name: repair-migrated-frontend-lock

on:
  pull_request:
    paths: ['.github/workflows/repair-frontend-lock.yml']

permissions:
  contents: read

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'migration/source-and-requirements'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Deduplicate the exact already-locked CodeMirror state version
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          package_path = Path('frontend/package.json')
          lock_path = Path('frontend/package-lock.json')
          package = json.loads(package_path.read_text())
          lock = json.loads(lock_path.read_text())
          packages = lock['packages']
          nested = 'node_modules/@codemirror/view/node_modules/@codemirror/state'
          state = packages.get(nested, packages['node_modules/@codemirror/state'])
          assert state['version'] == '6.7.1'
          assert state['integrity'] == 'sha512-9QzNDgE4EYDnAHfrTlR2lwiPciiOymLtwKK+8yHQzCc7GXhAP9xdEbEJFy2IWB1j9UGUl9BsgMmTo/ImA02T7A=='
          package['dependencies']['@codemirror/state'] = state['version']
          packages['']['dependencies']['@codemirror/state'] = state['version']
          packages['node_modules/@codemirror/state'] = state
          for path in list(packages):
              if path.endswith('/node_modules/@codemirror/state') and path != 'node_modules/@codemirror/state':
                  assert packages[path] == state
                  del packages[path]
          package_path.write_text(json.dumps(package, indent=2) + '\n')
          lock_path.write_text(json.dumps(lock, indent=2) + '\n')
          PY
      - name: Commit only the reviewed dependency files
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/package.json frontend/package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package.json frontend/package-lock.json
          git commit -m 'fix(frontend): use one compatible CodeMirror state instance'
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
